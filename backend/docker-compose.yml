version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=trim_user
      - POSTGRES_PASSWORD=trim_password
      - POSTGRES_DB=trim_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=trim_user
      - POSTGRES_PASSWORD=trim_password
      - POSTGRES_DB=trim_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trim_user -d trim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
